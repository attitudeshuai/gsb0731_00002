services:
  mysql:
    image: mysql:8.0
    container_name: dbmanager-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_manager}
      MYSQL_USER: ${MYSQL_USER:-dbmanager}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dbmanager123}
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dbmanager-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dbmanager-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_manager}
      MYSQL_USER: ${MYSQL_USER:-dbmanager}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dbmanager123}
      AES_SECRET_KEY: ${AES_SECRET_KEY:-MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      TZ: UTC
    networks:
      - dbmanager-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dbmanager-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - dbmanager-net

volumes:
  mysql-data:
    name: dbmanager-mysql-data

networks:
  dbmanager-net:
    name: dbmanager-net
    driver: bridge
