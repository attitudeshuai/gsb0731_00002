services:
  mysql:
    image: mysql:8.0
    container_name: dbmanager-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dbmanager}
      MYSQL_USER: ${MYSQL_USER:-dbmanager}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dbmanager123}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dbmanager-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dbmanager-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-dbmanager}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-dbmanager}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-dbmanager123}
      APP_AES_SECRET_KEY: ${APP_AES_SECRET_KEY:?APP_AES_SECRET_KEY must be set in .env}
    networks:
      - dbmanager-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dbmanager-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8088:80"
    networks:
      - dbmanager-net

volumes:
  mysql-data:

networks:
  dbmanager-net:
    driver: bridge
